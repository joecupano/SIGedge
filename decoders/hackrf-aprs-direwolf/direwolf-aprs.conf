#
# decoders/hackrf-aprs-direwolf/direwolf-aprs.conf
#
# Minimal direwolf config for decode-only use against radiod@hackrf-aprs's
# audio (fed via stdin by run.sh -- no ADEVICE line here; the audio device
# is selected on the command line with the trailing "-", per `man
# direwolf`). Channel/MODEM are omitted because direwolf's own defaults
# (channel 0, 1200 baud AFSK) already match APRS 144.390 FM.
#
# This decodes and logs packets locally. It does not transmit (no PTT is
# configured) and does not relay to APRS-IS. To do either, replace MYCALL
# below and add the relevant IGSERVER/IGLOGIN or PTT lines -- see
# /usr/local/share/doc/direwolf/conf/direwolf.conf (the full annotated
# reference) for the exact syntax. Treat an IGate the same as any other
# outbound network path in this project: an explicit, deliberate opt-in,
# not a default.
#

MYCALL N0CALL-10

# AGW/KISS network ports are direwolf defaults; left enabled so another
# local tool (e.g. Xastir, aprsc) can attach to decoded packets without
# editing this file. Comment out AGWPORT/KISSPORT to decode-and-log only.
