# SIGedge ka9q-radio configuration -- proven reference mission
# SDR: RX-888 MkII
# Signal: WWV
# Channel: 10.000 MHz
# Mode: AM
#
# RX-888 is operated in direct-sampling mode at 64.8 Msps.
# SDDC_FX3.img is the normal ka9q-radio firmware default and is expected
# under /usr/local/share/ka9q-radio when pkg_rx888.sh has been installed.
#
# Deployed by scripts/cfg_ka9q-radio, which fills in this file's few
# host-specific placeholder lines below (TTL, network interface, device
# serial) and leaves everything else as-is.
#
# dns = yes makes both status and data static per NETWORKING.md's "Current
# static assignment" table, but they get there two different ways --
# ka9q-radio always suffixes the *global* status name with ".local" before
# resolving it (see radio.c's ensure_suffix() call), so a literal address
# there gets mangled and silently falls back to the dynamic hash. status
# stays the sigedge-rx888.local name and instead relies on a static
# /etc/hosts entry (managed by scripts/cfg_ka9q-radio) pointing that exact
# name at 239.192.1.10; data has no such mangling, so it's the literal
# address directly.

[global]
hardware = rx888
dns = yes
status = sigedge-rx888.local
mode = am
ttl = ##TTL##
data = 239.192.64.10
##IFACE##

[rx888]
device = rx888
description = "SIGedge RX-888 WWV 10 MHz"
samprate = 64800000
firmware = SDDC_FX3.img
##SERIAL##

[wwv-10mhz]
freq = "10m0"
