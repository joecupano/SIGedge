# SIGedge ka9q-radio configuration -- proven reference mission
# SDR: RX-888 MkII
# Signal: WWV
# Channel: 10.000 MHz
# Mode: AM
#
# RX-888 is operated in direct-sampling mode at 64.8 Msps.
# SDDC_FX3.img is the normal ka9q-radio firmware default and is expected
# under /usr/local/share/ka9q-radio when pkg_rx888.sh has been installed.
#
# Deployed by scripts/cfg_ka9q-radio, which fills in this file's few
# host-specific placeholder lines below (TTL, network interface, device
# serial) and leaves everything else as-is. Naming follows the
# sigedge-<hardware>.local / sigedge-<channel>.local convention in
# NETWORKING.md.

[global]
hardware = rx888
status = sigedge-rx888.local
mode = am
ttl = ##TTL##
data = sigedge-wwv10.local
##IFACE##

[rx888]
device = rx888
description = "SIGedge RX-888 WWV 10 MHz"
samprate = 64800000
firmware = SDDC_FX3.img
##SERIAL##

[wwv-10mhz]
freq = "10m0"
