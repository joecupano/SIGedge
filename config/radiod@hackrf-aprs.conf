# SIGedge ka9q-radio configuration -- proven reference mission
# SDR: HackRF One
# Signal: APRS
# Channel: 144.390 MHz
# Mode: FM
#
# The hardware center frequency is offset +250 kHz from the desired
# channel by default to keep the wanted signal away from zero IF/DC.
# Override with HACKRF_CENTER_HZ if required.
#
# Deployed by scripts/cfg_ka9q-radio, which fills in this file's few
# host-specific placeholder lines below (TTL, tuner center frequency,
# network interface, device serial) and leaves everything else as-is.
#
# dns = yes makes both status and data static per NETWORKING.md's "Current
# static assignment" table, but they get there two different ways --
# ka9q-radio always suffixes the *global* status name with ".local" before
# resolving it (see radio.c's ensure_suffix() call), so a literal address
# there gets mangled and silently falls back to the dynamic hash. status
# stays the sigedge-hackrf.local name and instead relies on a static
# /etc/hosts entry (managed by scripts/cfg_ka9q-radio) pointing that exact
# name at 239.192.1.20; data has no such mangling, so it's the literal
# address directly.

[global]
hardware = hackrf
dns = yes
status = sigedge-hackrf.local
mode = fm
ttl = ##TTL##
data = 239.192.64.20
##IFACE##

[hackrf]
device = hackrf
description = "SIGedge HackRF APRS 144.390 MHz"
frequency = ##CENTER_HZ##
##SERIAL##

[aprs-144390]
freq = "144m390"
