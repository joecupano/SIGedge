# SIGedge ka9q-radio configuration -- proven reference mission
# SDR: HackRF One
# Signal: APRS
# Channel: 144.390 MHz
# Mode: FM
#
# The hardware center frequency is offset +250 kHz from the desired
# channel by default to keep the wanted signal away from zero IF/DC.
# Override with HACKRF_CENTER_HZ if required.
#
# Deployed by scripts/cfg_ka9q-radio, which fills in this file's few
# host-specific placeholder lines below (TTL, tuner center frequency,
# network interface, device serial) and leaves everything else as-is.
# Naming follows the sigedge-<hardware>.local / sigedge-<channel>.local
# convention in NETWORKING.md.

[global]
hardware = hackrf
status = sigedge-hackrf.local
mode = fm
ttl = ##TTL##
data = sigedge-aprs.local
##IFACE##

[hackrf]
device = hackrf
description = "SIGedge HackRF APRS 144.390 MHz"
frequency = ##CENTER_HZ##
##SERIAL##

[aprs-144390]
freq = "144m390"
